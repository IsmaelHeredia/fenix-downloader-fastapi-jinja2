<div id="panel-playlist" class="fenix-tab-panel hidden space-y-5">
  <div>
    <label class="fenix-label">
      <svg class="fenix-icon-sm" viewBox="0 0 24 24" style="color: var(--accent);">
        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" />
        <line x1="9" y1="11" x2="15" y2="11" />
        <line x1="9" y1="15" x2="15" y2="15" />
        <line x1="9" y1="7" x2="15" y2="7" />
      </svg>
      Link de la playlist
    </label>
    <textarea id="links-textarea-playlist" class="fenix-textarea mt-1.5" data-role="links-source"
      placeholder="https://youtube.com/playlist?list=PL123456789"></textarea>
    <p class="text-xs mt-1.5 fenix-muted">Pegá solo el link de la playlist</p>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <div>
      <label class="fenix-label">
        <svg class="fenix-icon-sm" viewBox="0 0 24 24" style="color: var(--accent);">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" />
        </svg>
        Directorio (opcional)
      </label>
      <input type="text" name="output_folder" class="fenix-input mt-1.5" placeholder="carpeta/subcarpeta"
        autocomplete="off">
    </div>
  </div>

  <div>
    <label class="fenix-label mb-2">
      <svg class="fenix-icon-sm" viewBox="0 0 24 24" style="color: var(--accent);">
        <path d="M9 18V5l12-2v13" />
        <circle cx="6" cy="18" r="3" />
        <circle cx="18" cy="16" r="3" />
      </svg>
      Tipo de descarga
    </label>
    <div class="flex flex-wrap gap-2">
      <button type="button" class="tipo-btn fenix-btn-primary" data-tipo="playlist_songs"
        onclick="setTipo('playlist', 'playlist_songs', this)">
        <svg class="fenix-icon-sm" viewBox="0 0 24 24" stroke="currentColor">
          <path d="M9 18V5l12-2v13" />
          <circle cx="6" cy="18" r="3" />
          <circle cx="18" cy="16" r="3" />
        </svg>
        Descargar como canciones (MP3)
      </button>
      <button type="button" class="tipo-btn fenix-btn-outline" data-tipo="playlist_videos"
        onclick="setTipo('playlist', 'playlist_videos', this)">
        <svg class="fenix-icon-sm" viewBox="0 0 24 24" stroke="currentColor">
          <rect x="2" y="4" width="20" height="16" rx="2" ry="2" />
          <polygon points="10 8 16 12 10 16 10 8" />
        </svg>
        Descargar como videos (MP4)
      </button>
    </div>

    <div class="mt-4">
      <label class="fenix-label mb-1.5">
        <svg class="fenix-icon-sm" viewBox="0 0 24 24" style="color: var(--accent);">
          <rect x="2" y="4" width="20" height="16" rx="2" ry="2" />
          <polyline points="10 9 15 12 10 15" />
        </svg>
        Calidad de video
      </label>
      <select name="quality" class="fenix-input">
        <option value="max">Máxima calidad (evitar AV1 / hasta 4K)</option>
        <option value="1080" selected>1080p (Full HD) — Recomendado</option>
        <option value="720">720p (HD)</option>
      </select>
      <p class="text-xs mt-1.5 fenix-muted">Aplica sobre todo a descargas de video. En MP3 solo afecta el archivo
        temporal.</p>
    </div>

    <div class="mt-4 space-y-2.5">
      <label class="flex items-start gap-2.5 cursor-pointer select-none">
        <input type="checkbox" name="prefer_spanish_audio" value="1" class="fenix-checkbox">
        <span class="text-sm" style="color: var(--text-secondary);">
          <span class="font-medium" style="color: var(--text-primary);">Preferir doblaje automático en español</span>
          <br><span class="text-xs fenix-muted">Solo si está disponible en cada video.</span>
        </span>
      </label>
      <label class="flex items-start gap-2.5 cursor-pointer select-none">
        <input type="checkbox" name="spanish_subs" value="1" class="fenix-checkbox">
        <span class="text-sm" style="color: var(--text-secondary);">
          <span class="font-medium" style="color: var(--text-primary);">Incluir subtítulos en español</span>
          <br><span class="text-xs fenix-muted">Oficiales o automáticos, solo si existen.</span>
        </span>
      </label>
      <label class="flex items-start gap-2.5 cursor-pointer select-none">
        <input type="checkbox" name="use_cookies" value="1" class="fenix-checkbox">
        <span class="text-sm" style="color: var(--text-secondary);">
          <span class="font-medium" style="color: var(--text-primary);">Usar cookies de YouTube</span>
          <br>
          <span class="text-xs fenix-muted">
            Opcional. Para edad / rate limit. Requiere
            <code class="text-xs">data/cookies.txt</code>.
            Si no hay archivo, se continúa sin cookies.
          </span>
        </span>
      </label>
    </div>
  </div>

  <input type="hidden" name="tipo" id="tipo-playlist" value="playlist_songs">
</div>
